server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Backend API — proxy_pass has no path component, so nginx forwards the
    # original request URI (including the /api prefix) unchanged.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-Sent Events bridge (see events/server.py) — proxy_pass has no
    # path component, so nginx forwards the original URI (including the
    # /events prefix) unchanged, same as /api/. Buffering must stay off and
    # the read timeout generous, or nginx will hold back / kill a stream
    # that's meant to stay open indefinitely.
    location /events/ {
        proxy_pass http://events:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SvelteKit frontend — everything else.
    location / {
        proxy_pass http://frontend:2000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
